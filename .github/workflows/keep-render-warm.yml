name: Keep Render warm

# The backend runs on Render's free tier, which spins the service down
# after ~15 minutes with no traffic — the next request then pays a
# 30-60s cold start. Pinging /health (a cheap, unauthenticated endpoint
# that does no DB work) more often than that window keeps it from ever
# spinning down. 10 minutes leaves margin below the 15-minute threshold,
# since scheduled GitHub Actions runs aren't guaranteed to fire exactly
# on time — they can run a few minutes late during periods of high
# platform load.
#
# At this interval the service is effectively never idle, so it runs
# ~24/7 (~744 hours/month) — just under Render's 750 free instance-hour
# cap for the whole workspace. That's fine as the only free service
# drawing from that pool; adding another would risk going over near
# month-end.
"on":
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # allows a manual run from the Actions tab, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 5 https://training-calendar.onrender.com/health
