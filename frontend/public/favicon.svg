<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- RaceCondition mark: the app header's blue-into-navy gradient
       (see .app-header and the primary button in styles.css), with the
       RC monogram. -->
  <defs>
    <linearGradient id="rc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="55%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1c3461" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#rc-bg)" />

  <!-- Sport-colour accent along the base: the calendar's own swim / bike /
       run hues (SPORT_COLORS in src/utils/workouts.js), left to right in
       race order, kept thin so it reads as a stripe at 16px rather than
       competing with the letters. -->
  <g opacity="0.9">
    <rect x="12" y="50" width="13.3" height="3.2" rx="1.6" fill="#0ea5e9" />
    <rect x="25.3" y="50" width="13.3" height="3.2" rx="1.6" fill="#8b5cf6" />
    <rect x="38.6" y="50" width="13.4" height="3.2" rx="1.6" fill="#22c55e" />
  </g>

  <text x="32" y="38"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30"
        font-weight="700"
        letter-spacing="-1"
        fill="#ffffff">RC</text>
</svg>
